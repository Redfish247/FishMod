<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FishMod Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Explorer-style window: tabs, command bar, address bar, nav pane, item grid, details pane, status bar */
:root{--bg:#ececec;--win:#f8f8f8;--pane:#efefef;--line:#d9d9d9;--fg:#1e1e1e;--mut:#666666;--acc:#3c3c3c;--accs:#dadada;--on:#1a9b5a;--off:#a3a3a3;
--fd:'Space Grotesk',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--win:#1e1e1e;--pane:#181818;--line:#303030;--fg:#e6e6e6;--mut:#9a9a9a;--acc:#4d4d4d;--accs:#262626;--on:#3ccf86;--off:#5c5c5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--win:#1e1e1e;--pane:#181818;--line:#303030;--fg:#e6e6e6;--mut:#9a9a9a;--acc:#4d4d4d;--accs:#262626;--on:#3ccf86;--off:#5c5c5c;color-scheme:dark}
html,body{height:100%}body{background:var(--bg);color:var(--fg);font-family:var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
*{box-sizing:border-box}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.win{height:100%;min-height:560px;display:grid;grid-template-rows:auto auto auto 1fr auto;background:var(--win);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 12px 40px #0002}
.tabs{display:flex;align-items:stretch;gap:2px;padding:10px 10px 0;min-height:46px;background:var(--pane);overflow-x:auto}
.tab{display:flex;gap:10px;align-items:center;padding:0 14px;height:36px;margin-top:auto;border-radius:8px 8px 0 0;font-size:13px;color:var(--mut);white-space:nowrap}
.tab.act{background:var(--win);color:var(--fg)}.tab .x{opacity:.5}.tab.add{font-size:18px;line-height:1;width:36px;padding:0;justify-content:center;border-radius:8px;margin-bottom:0}.tab.add:hover{background:var(--win)}
.cmd{display:flex;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.cmd button{padding:6px 10px;border-radius:6px;font-size:13px;display:flex;gap:6px;align-items:center}.cmd button:hover{background:var(--pane)}
.cmd .save{background:var(--acc);color:#fff;margin-left:6px}.cmd .save:hover{background:var(--acc);filter:brightness(1.2)}.cmd #b-reset.arm{color:#e05a5a}.toast{font-size:12px;color:var(--mut);margin-right:8px}.nav button:disabled{opacity:.35;cursor:default}.sep{width:1px;height:20px;background:var(--line);margin:0 4px}.sp{flex:1}
.seg{display:flex;background:var(--pane);border-radius:6px;padding:2px}.seg button.on{background:var(--win);box-shadow:0 1px 2px #0002}
.addr{display:flex;gap:8px;padding:8px 10px;align-items:center;border-bottom:1px solid var(--line)}
.nav{display:flex;gap:2px}.nav button{width:28px;height:28px;border-radius:6px;color:var(--mut)}.nav button:hover{background:var(--pane)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:4px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;overflow:hidden;white-space:nowrap}
.crumb button{padding:1px 4px;border-radius:4px}.crumb button:hover{background:var(--accs)}.crumb i{color:var(--mut);font-style:normal}
.search{width:240px;max-width:40%;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--win);color:var(--fg);font:inherit;font-size:13px}
.main{display:grid;grid-template-columns:220px 1fr 280px;min-height:0}
.side{background:var(--pane);border-right:1px solid var(--line);overflow:auto;padding:8px 6px;font-size:13px}
.side h4{font:600 11px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:12px 8px 4px}
.side button{display:flex;width:100%;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;text-align:left}
.side button:hover{background:var(--win)}.side button.act{background:var(--accs);font-weight:600}
.side .n{margin-left:auto;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.ico{width:16px;height:13px;border-radius:2px 2px 3px 3px;background:var(--c,#e6b54a);position:relative;flex:none}.ico::before{content:"";position:absolute;left:0;top:-3px;width:7px;height:4px;border-radius:2px 2px 0 0;background:inherit}
.items{overflow:auto;padding:14px;min-width:0}
.items h2{font:600 20px var(--fd);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.it{border:1px solid transparent;border-radius:8px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:8px}
.it:hover{background:var(--pane)}.it.sel{background:var(--accs);border-color:var(--acc)}
.it .t{font-size:13px;font-weight:500}.it .d{font-size:12px;color:var(--mut);line-height:1.35}
.badge{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font:600 14px var(--fd);color:#fff;background:var(--c)}
.row{display:flex;justify-content:space-between;align-items:center}
.sw{width:34px;height:18px;border-radius:9px;background:var(--off);position:relative;flex:none;transition:.15s}.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.tg{cursor:pointer}.sw.on{background:var(--on)}.sw.on::after{left:18px}
.list .grid{display:flex;flex-direction:column;gap:0}.list .it{flex-direction:row;align-items:center;padding:6px 10px;gap:12px}.list .badge{width:24px;height:24px;font-size:11px;border-radius:6px}.list .it .d{flex:1}.list .it .t{width:200px}
.det{border-left:1px solid var(--line);overflow:auto;padding:16px;font-size:13px}
.det h3{font:600 18px var(--fd);margin:0 0 4px}.det p{color:var(--mut);margin:0 0 14px;line-height:1.45}
.set{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:8px}.set input[type=range]{width:100px;accent-color:var(--acc)}.sl{display:flex;align-items:center;gap:6px}.num{width:52px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--pane);color:var(--fg);font:inherit;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.status{display:flex;gap:16px;padding:5px 12px;font-size:12px;color:var(--mut);border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.empty{color:var(--mut);padding:30px 0}
@media(max-width:860px){.main{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}.side h4{display:none}.side button{width:auto;white-space:nowrap}.side .n{display:none}.det{border-left:0;border-top:1px solid var(--line)}.search{width:130px}.list .it .t{width:auto}.list .it .d{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="win">
 <div class="tabs" id="tabs"></div>
 <div class="cmd">
  <button id="b-hud">Edit HUD</button><div class="sep"></div>
  <button id="b-rep">Report</button><button id="b-cred">Credits</button><button id="b-reset">Reset</button>
  <span class="sp"></span><span id="toast" class="toast"></span>
  <div class="seg"><button id="vg" class="on" title="Grid view">Grid</button><button id="vl" title="List view">List</button></div><button id="b-save" class="save">Save &amp; Close</button>
 </div>
 <div class="addr">
  <div class="nav"><button id="nb" aria-label="Back">←</button><button id="nf" aria-label="Forward">→</button><button id="nu" aria-label="Up">↑</button></div>
  <div class="crumb" id="crumb"></div>
  <input class="search" id="q" placeholder="Search features">
 </div>
 <div class="main">
  <nav class="side" id="side"></nav>
  <section class="items" id="items"></section>
  <aside class="det" id="det"></aside>
 </div>
 <div class="status" id="st"></div>
</div>
<script>
const C={"General":["#5b8def",[["Compact GUI","Tighter rows and gaps so more fits"],["Menu Animations","Columns slide in on open"],["Server Restart Alert","Warns before a server reboot",0],["Auto Update Check","Tell me when a new version is out"]]],
"Chat":["#3fa7a3",[["Chat Tabs","Split chat into All, Party, Guild"],["Chat Search","Ctrl+F through chat history"],["Chat Filter","Hide spammy lines"],["Compact Chat","Stack repeated messages"]]],
"Inventory & Storage":["#c08a3e",[["Slot Lock","Lock slots against drops"],["No Recipe Book","Hide the recipe button"],["Storage Overlay","Preview backpacks and ender chest"]]],
"Party & Social":["#b45fd1",[["Party Join Sound","Ping when someone joins"],["Party Finder Stats","Show cata and secrets in PF"]]],
"Dungeons":["#d0533f",[["Secret Waypoints","Mark room secrets"],["Mimic Alert","Say when the Mimic dies"],["Blood Timer","Track blood camp time"]]],
"Dungeon Solvers":["#e07a2f",[["Three Weirdos","Highlight the right chest"],["Ice Fill","Draw the path"],["Teleport Maze","Mark used pads"],["Water Board","Show lever order"]]],
"Floor 7":["#8e3fd1",[["Terminal Solvers","Melody, colors, order"],["Dragon Spawn Timers","Per-dragon countdown"],["Goldor Tick","Death tick timer"]]],
"HUD & Overlays":["#2f9e6a",[["Item Pickup Log","+/- items as they change"],["Bits Warning","Cookie and bits reminder"]]],
"Slayer":["#c23b5a",[["Boss Timer","Kill time per boss"],["Slayer Highlight","Glow your boss"]]],
"The End":["#6d5bd0",[["Dragon Alerts","Who placed eyes, what spawned"],["Zealot Counter","Zealots since last eye"]]],
"Hunting & Foraging":["#5a9a3a",[["Shard Tracker","Shards per hour"],["Lasso Helper","When to reel"],["HotF Helper","Perk levels and whispers"]]],
"Alerts & Reminders":["#d6a12a",[["Limbo Alert","Ping when sent to limbo"],["Order Filled","Bazaar order done"],["Vanquisher Share","Post coords to party"]]],
"Cosmetics":["#d65aa0",[["Fish Size","Scale your player"],["Custom Cape","Pick a cape"]]]};
const S={};for(const k in C)C[k][1].forEach(f=>S[k+"/"+f[0]]=f[2]!==0);
let col="Dungeon Solvers",sel="Ice Fill",view="grid",tabs=["Dungeon Solvers","Chat","Floor 7"],ai=0,hist=[["Dungeon Solvers","Ice Fill"]],hi=0,armed=0;
function go(c,f){col=c;sel=f;tabs[ai]=c;$("q").value="";hist=hist.slice(0,hi+1);const l=hist[hi];if(!l||l[0]!==c||l[1]!==f){hist.push([c,f]);hi=hist.length-1}}
function toast(m){$("toast").textContent=m;clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").textContent="",2500)}
const pinned=["General","Dungeon Solvers","Floor 7"],$=id=>document.getElementById(id),esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function ini(s){return s.split(/\s+/).map(w=>w[0]).join("").slice(0,2)}
function render(){const q=$("q").value.toLowerCase();
 $("tabs").innerHTML=tabs.map((t,i)=>'<button class="tab'+(i===ai?' act':'')+'" data-t="'+i+'">'+esc(t)+' <span class="x" data-x="'+i+'">✕</span></button>').join("")+'<button class="tab add" id="addtab" aria-label="New tab">＋</button>';
 const nb=k=>'<button class="'+(k===col?'act':'')+'" data-c="'+esc(k)+'">'+esc(k)+'<span class="n">'+C[k][1].filter(f=>S[k+"/"+f[0]]).length+'/'+C[k][1].length+'</span></button>';
 $("side").innerHTML="<h4>Pinned</h4>"+pinned.map(nb).join("")+"<h4>All columns</h4>"+Object.keys(C).map(nb).join("");
 $("crumb").innerHTML='<button data-c="General">FishMod</button><i>›</i><button data-c="'+esc(col)+'">'+(q?'Search results':esc(col))+'</button>'+(sel&&!q?'<i>›</i><span>'+esc(sel)+'</span>':'');
 let list=q?Object.keys(C).flatMap(k=>C[k][1].filter(f=>(f[0]+f[1]).toLowerCase().includes(q)).map(f=>[k,f])):C[col][1].map(f=>[col,f]);
 $("items").className="items"+(view==="list"?" list":"");
 $("items").innerHTML='<h2>'+(q?list.length+' results for “'+esc(q)+'”':esc(col))+'</h2>'+(list.length?'<div class="grid">'+list.map(([k,f])=>{const on=S[k+"/"+f[0]];return '<button class="it'+(f[0]===sel?' sel':'')+'" data-k="'+esc(k)+'" data-f="'+esc(f[0])+'"><div class="row"><span class="sw'+(on?' on':'')+'" data-sw="1" role="switch" aria-checked="'+on+'"></span></div><span class="t">'+esc(f[0])+'</span><span class="d">'+esc(q?k+' · '+f[1]:f[1])+'</span></button>'}).join("")+'</div>':'<p class="empty">No feature matches. Try a shorter word.</p>');
 const fk=Object.keys(C).find(k=>C[k][1].some(f=>f[0]===sel)),f=fk&&C[fk][1].find(f=>f[0]===sel);
 $("det").innerHTML=f?'<h3>'+esc(f[0])+'</h3><p>'+esc(f[1])+'. In '+esc(fk)+'.</p><div class="set"><label>Enabled <span class="sw'+(S[fk+"/"+f[0]]?' on':'')+'" id="dsw" role="switch"></span></label><label for="c1">Highlight color <input id="c1" type="color" value="#8a8a8a"></label><label for="o1">Opacity <span class="sl"><input id="o1" type="range" min="0" max="100" value="70"><input id="o1n" class="num" type="number" min="0" max="100" value="70" aria-label="Opacity value"></span></label><label for="w1">Line width <span class="sl"><input id="w1" type="range" min="1" max="10" step="0.5" value="2.5"><input id="w1n" class="num" type="number" min="1" max="10" step="0.5" value="2.5" aria-label="Line width value"></span></label><label>Text shadow <span class="sw on tg" role="switch" aria-checked="true" tabindex="0"></span></label></div>':'<p>Select a feature to see its settings.</p>';
 const all=Object.keys(S).length,en=Object.values(S).filter(Boolean).length;
 $("nb").disabled=hi<=0;$("nf").disabled=hi>=hist.length-1;$("nu").disabled=!q&&!sel&&col==="General";
 $("st").innerHTML='<span>'+list.length+' items</span><span>'+(sel?'1 selected':'')+'</span><span class="sp"></span><span>'+en+' of '+all+' features on</span>';
}
document.addEventListener("click",e=>{const g=e.target.closest(".tg");if(g){g.classList.toggle("on");g.setAttribute("aria-checked",g.classList.contains("on"));return}
 const t=e.target.closest("[data-x],[data-t],[data-c],[data-k],#dsw,#vg,#vl,#addtab,#nb,#nf,#nu,#b-hud,#b-rep,#b-cred,#b-reset,#b-save");if(!t)return;
 if(t.id!=="b-reset"&&armed){armed=0;$("b-reset").textContent="Reset";$("b-reset").classList.remove("arm")}
 if(t.id==="nb"||t.id==="nf"){hi+=t.id==="nb"?-1:1;[col,sel]=hist[hi];tabs[ai]=col;$("q").value="";render();return}
 if(t.id==="nu"){if($("q").value){$("q").value=""}else if(sel){go(col,null)}else go("General",null);render();return}
 if(t.id==="b-hud"){toast("Opens the HUD editor");return}
 if(t.id==="b-rep"){toast("Opens the bug report screen");return}
 if(t.id==="b-cred"){toast("Opens credits");return}
 if(t.id==="b-save"){toast("Saved. Menu closes");return}
 if(t.id==="b-reset"){if(!armed){armed=1;t.textContent="Confirm?";t.classList.add("arm");setTimeout(()=>{if(armed){armed=0;t.textContent="Reset";t.classList.remove("arm")}},3000);return}
  armed=0;t.textContent="Reset";t.classList.remove("arm");for(const k in C)C[k][1].forEach(f=>S[k+"/"+f[0]]=f[2]!==0);toast("All columns reset to defaults");render();return}
 if(t.id==="addtab"){tabs.push(col);ai=tabs.length-1}
 else if(t.dataset.x){if(tabs.length>1){const i=+t.dataset.x;tabs.splice(i,1);if(ai>=i&&ai>0)ai--;col=tabs[ai]}}
 else if(t.dataset.t){ai=+t.dataset.t;go(tabs[ai],sel&&C[tabs[ai]][1].some(f=>f[0]===sel)?sel:null)}
 else if(t.dataset.c)go(t.dataset.c,null)
 else if(t.dataset.k){const k=t.dataset.k+"/"+t.dataset.f;if(e.target.dataset.sw)S[k]=!S[k];else{const q=$("q").value;go(t.dataset.k,t.dataset.f);$("q").value=q}}
 else if(t.id==="dsw"){const fk=Object.keys(C).find(k=>C[k][1].some(f=>f[0]===sel));S[fk+"/"+sel]=!S[fk+"/"+sel]}
 else{view=t.id==="vl"?"list":"grid";$("vg").classList.toggle("on",view==="grid");$("vl").classList.toggle("on",view==="list")}
 render()});
$("q").addEventListener("input",render);
document.addEventListener("input",e=>{const t=e.target,id=t.id;if(!id||id==="q")return;
 if(t.type==="range"){const n=$(id+"n");if(n)n.value=t.value}
 else if(t.classList.contains("num")){const r=$(id.slice(0,-1));if(r&&t.value!==""){const v=Math.min(+r.max,Math.max(+r.min,+t.value));r.value=v}}});
document.addEventListener("change",e=>{const t=e.target;if(t.classList&&t.classList.contains("num")){const r=$(t.id.slice(0,-1));if(r)t.value=r.value}});render();
</script>
