<style>

.stage::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 48px,#0000000d 48px 50px),repeating-linear-gradient(0deg,#0000 0 48px,#0000000d 48px 50px)}
.win{position:absolute;z-index:1;left:max(16px,calc(50% - 590px));top:24px;width:min(1180px,calc(100% - 32px));height:min(640px,calc(100% - 48px));min-height:420px;display:grid;grid-template-rows:auto auto auto 1fr auto;background:var(--win);color:var(--fg);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 18px 50px #0006}

.tg{cursor:pointer}.sw.on{background:var(--on)}.sw.on::after{left:18px}
.list .grid{display:flex;flex-direction:column;gap:0}.list .it{flex-direction:row;align-items:center;padding:6px 10px;gap:12px}.list .badge{width:24px;height:24px;font-size:11px;border-radius:6px}.list .it .d{flex:1}.list .it .t{width:200px}

.set{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}

@media(max-width:860px){.main.nodet{grid-template-columns:1fr}.win{left:16px!important;top:16px!important}.main{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}.side h4{display:none}.side button{width:auto;white-space:nowrap}.side .n{display:none}.det{border-left:0;border-top:1px solid var(--line)}.search{width:130px}.list .it .t{width:auto}.list .it .d{display:none}}

button,.tab,.it,.sw,.sw::after,.crumb button,.side button{transition:background-color .18s,color .18s,border-color .18s,box-shadow .18s,transform .12s,filter .18s}
button:active{transform:scale(.97)}
.win{transition:left .28s cubic-bezier(.2,.8,.2,1),top .28s cubic-bezier(.2,.8,.2,1),width .28s cubic-bezier(.2,.8,.2,1),height .28s cubic-bezier(.2,.8,.2,1),border-radius .28s,background-color .3s,box-shadow .3s,border-color .3s}

function lensMap(){const r=W.getBoundingClientRect(),w=Math.max(40,Math.round(r.width/2)),h=Math.max(40,Math.round(r.height/2)),B=26,R=9;
 const cv=document.createElement("canvas");cv.width=w;cv.height=h;const x=cv.getContext("2d"),im=x.createImageData(w,h),d=im.data;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const px=i+.5-w/2,py=j+.5-h/2,qx=Math.abs(px)-(w/2-R),qy=Math.abs(py)-(h/2-R);
  const ox=Math.max(qx,0),oy=Math.max(qy,0),dist=R-(Math.hypot(ox,oy)+Math.min(Math.max(qx,qy),0));let nx=0,ny=0;
  if(ox>0||oy>0){const l=Math.hypot(ox,oy)||1;nx=ox/l;ny=oy/l}else if(qx>qy)nx=1;else ny=1;nx*=Math.sign(px)||1;ny*=Math.sign(py)||1;
  const t=dist<B?Math.pow(1-Math.max(0,dist)/B,2):0,o=(j*w+i)*4;d[o]=128+nx*127*t;d[o+1]=128+ny*127*t;d[o+2]=128;d[o+3]=255}
 x.putImageData(im,0,0);document.getElementById("lgm").setAttribute("href",cv.toDataURL())}
