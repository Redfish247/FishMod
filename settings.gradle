pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven { url = 'https://maven.kikugie.dev/releases' }
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'FishModDungeons'

def with263 = gradle.startParameter.projectProperties.containsKey('with263') || providers.gradleProperty('with263').isPresent()

stonecutter {
	centralScript = 'build.gradle'
	kotlinController = false
	create(rootProject) {
		if (with263) versions('26.1.2', '26.2', '26.3')
		else versions('26.1.2', '26.2')
		vcsVersion = '26.1.2'
	}
}

include 'common'
include 'practical-config-relocated'
