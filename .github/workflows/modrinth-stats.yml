name: Weekly Modrinth stats

# Every Monday, saves last week's (Monday to Sunday, Central time) FishMod views,
# downloads, playtime and revenue from Modrinth to stats/modrinth/YYYY-MM-DD.json
# (+ .md), where the date is the Monday the week started.
#
# Needs repo secret MODRINTH_TOKEN: a Modrinth personal access token with only
# "Read analytics" (views, downloads, playtime) and "Read payouts" (revenue).
# Without "Read payouts" everything still works and revenue is left blank.
#
# Run it by hand from the Actions tab; the box takes the Monday of the week as YYYY-MM-DD (blank = last week).

on:
  schedule:
    - cron: "0 23 * * 1" # Mondays, 5 PM Central (6 PM during daylight time)
  workflow_dispatch:
    inputs:
      week_start:
        description: "Monday of the week to fetch as YYYY-MM-DD (blank = last week)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: modrinth-stats

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch last week's stats from Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          WEEK_INPUT: ${{ inputs.week_start }}
        run: |
          set -euo pipefail
          if [ -z "${MODRINTH_TOKEN:-}" ]; then echo "::error::MODRINTH_TOKEN secret is missing"; exit 1; fi
          UA="Redfish247/FishModDungeons weekly-stats"

          # Week boundaries (Monday 00:00 to next Monday 00:00) in Central time
          if [ -n "${WEEK_INPUT:-}" ]; then PERIOD="$WEEK_INPUT"; else
            TODAY=$(TZ=America/Chicago date +%Y-%m-%d); DOW=$(TZ=America/Chicago date +%u)
            PERIOD=$(date -u -d "$TODAY -$((DOW - 1 + 7)) days" +%Y-%m-%d)
          fi
          [[ "$PERIOD" =~ ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]] || { echo "::error::Week start must look like 2026-11-16"; exit 1; }
          [ "$(date -u -d "$PERIOD" +%u)" = "1" ] || { echo "::error::$PERIOD is not a Monday"; exit 1; }
          NEXT=$(date -u -d "$PERIOD +7 days" +%Y-%m-%d)
          START=$(date -u -d "@$(TZ=America/Chicago date -d "$PERIOD 00:00" +%s)" +%Y-%m-%dT%H:%M:%SZ)
          END=$(date -u -d "@$(TZ=America/Chicago date -d "$NEXT 00:00" +%s)" +%Y-%m-%dT%H:%M:%SZ)
          DAYS=$(( ( $(date -d "$END" +%s) - $(date -d "$START" +%s) + 43200 ) / 86400 ))
          echo "Fetching week of $PERIOD ($START to $END, $DAYS days)"

          PROJECT_ID=$(curl -fsS -A "$UA" https://api.modrinth.com/v2/project/fishmod | jq -r .id)

          body() {
            jq -n --arg s "$START" --arg e "$END" --argjson n "$DAYS" --arg p "$PROJECT_ID" --argjson m "$1" \
              '{time_range: {start: $s, end: $e, resolution: {slices: $n}}, return_metrics: $m, project_ids: [$p]}'
          }
          ask() {
            curl -sS -A "$UA" -H "Authorization: $MODRINTH_TOKEN" -H "Content-Type: application/json" \
              -o "$2" -w "%{http_code}" -X POST https://api.modrinth.com/v3/analytics -d "$(body "$1")"
          }

          CODE=$(ask '{"project_views":{},"project_downloads":{},"project_playtime":{}}' main.json)
          if [ "$CODE" != "200" ]; then
            echo "::error::Modrinth said $CODE. Check the token has Read analytics and hasn't expired."
            exit 1
          fi

          echo "Modrinth sent $(jq '.metrics | length' main.json) slices, $(jq '[.metrics[][]] | length' main.json) entries; kinds: $(jq -c '[.metrics[][] | .metric_kind] | unique' main.json); projects: $(jq -c '[.metrics[][] | .source_project] | unique' main.json) (asked for $PROJECT_ID)"
          MATCHED=$(jq --arg p "$PROJECT_ID" '[.metrics[][] | select(.source_project == $p or .source_project == "")] | length' main.json)
          if [ "$MATCHED" = "0" ]; then
            echo "::error::Modrinth returned no FishMod data for the week of $PERIOD, so nothing was saved. Check the token can read FishMod's analytics."
            exit 1
          fi

          # Revenue needs "Read payouts"; if the token doesn't have it, leave revenue blank
          if [ "$(ask '{"project_revenue":{}}' rev.json)" != "200" ]; then
            echo "::warning::Revenue skipped (token has no Read payouts)"
            echo '{"metrics":[]}' > rev.json
            REV_OK=false
          else
            REV_OK=true
          fi

          # Releases published this week (public data, so no token needed)
          if curl -fsS -A "$UA" https://api.modrinth.com/v2/project/fishmod/version -o all-versions.json \
             && jq --arg s "$START" --arg e "$END" '[.[] | select(.date_published >= $s and .date_published < $e)
                  | {version: .version_number, type: .version_type, published: .date_published, downloads: .downloads}]
                  | sort_by(.published)' all-versions.json > releases.json; then
            REL_OK=true
          else
            echo "::warning::Couldn't read FishMod's versions; releases left empty"
            echo '[]' > releases.json
            REL_OK=false
          fi

          mkdir -p stats/modrinth
          OUT="stats/modrinth/${PERIOD}.json"
          jq -n --slurpfile a main.json --slurpfile r rev.json --slurpfile rel releases.json --argjson relok "$REL_OK" \
            --arg week "$PERIOD" --arg start "$START" --arg end "$END" --arg p "$PROJECT_ID" --argjson revok "$REV_OK" '
            def pick($slice; $kind; $field):
              [$slice[]? | select((.source_project == $p or .source_project == "") and .metric_kind == $kind) | .[$field] | tonumber] | add // 0;
            ($start | fromdateiso8601) as $t0 |
            [range(0; $a[0].metrics | length) as $i |
              { date: (($t0 + $i * 86400) | strftime("%Y-%m-%d")),
                views: pick($a[0].metrics[$i]; "views"; "views"),
                downloads: pick($a[0].metrics[$i]; "downloads"; "downloads"),
                playtime_hours: ((pick($a[0].metrics[$i]; "playtime"; "seconds") / 3600 * 10 | round) / 10),
                revenue_usd: (if $revok then ((pick($r[0].metrics[$i]; "revenue"; "revenue") * 100 | round) / 100) else null end) }
            ] as $daily |
            { project: "fishmod", project_id: $p, week_start: $week,
              range: {start: $start, end: $end, timezone: "America/Chicago"},
              totals: {
                views: ($daily | map(.views) | add // 0),
                downloads: ($daily | map(.downloads) | add // 0),
                playtime_hours: (($daily | map(.playtime_hours) | add // 0) * 10 | round / 10),
                revenue_usd: (if $revok then (([$r[0].metrics[]?[]? | select((.source_project == $p or .source_project == "") and .metric_kind == "revenue") | .revenue | tonumber] | add // 0) * 100 | round / 100) else null end)
              },
              releases: $rel[0],
              releases_ok: $relok,
              daily: $daily,
              fetched_at: (now | todate) }' > "$OUT"

          jq -r '
            "# FishMod on Modrinth, week of \(.week_start)\n",
            "| Views | Downloads | Playtime (hours) | Revenue (USD) |",
            "| --- | --- | --- | --- |",
            "| \(.totals.views) | \(.totals.downloads) | \(.totals.playtime_hours) | \(.totals.revenue_usd // "n/a") |",
            "",
            "Best day for downloads: \(.daily | max_by(.downloads) | "\(.date) (\(.downloads))")",
            "",
            (if .releases_ok | not then "Releases: could not read them this run."
             elif (.releases | length) == 0 then "Releases: none this week."
             else "Releases (downloads so far):\n" + (.releases | map("- \(.version), \(.published[0:10]), \(.downloads)") | join("\n")) end),
            "",
            "Range: \(.range.start) to \(.range.end) (midnight Central). Fetched \(.fetched_at)."
          ' "$OUT" > "stats/modrinth/${PERIOD}.md"
          cat "stats/modrinth/${PERIOD}.md"

      - name: Save to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f stats/modrinth
          git diff --cached --quiet || (git commit -m "Modrinth stats for last week [skip ci]" && git pull --rebase -X theirs origin main && git push origin HEAD:main)
